name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, homepage-scholar]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/scholar-venv"
          echo "$RUNNER_TEMP/scholar-venv/bin" >> "$GITHUB_PATH"
      - name: Install requirements
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch citation data
        working-directory: google_scholar_crawler
        run: python -u main.py
        env:
          GOOGLE_SCHOLAR_ID: 'GkexPYgAAAAJ'
      - name: Publish citation data
        run: |
          cp -R google_scholar_crawler/results "$RUNNER_TEMP/scholar-results"
          git switch --orphan google-scholar-stats
          cp "$RUNNER_TEMP/scholar-results/"*.json .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Update citation data"
          git push origin HEAD:google-scholar-stats --force
      - name: Refresh citation CDN
        run: |
          curl --fail --retry 2 --max-time 30 'https://purge.jsdelivr.net/gh/HaoyuanXu/haoyuanxu.github.io@google-scholar-stats/gs_data.json'
          curl --fail --retry 2 --max-time 30 'https://purge.jsdelivr.net/gh/HaoyuanXu/haoyuanxu.github.io@google-scholar-stats/gs_data_shieldsio.json'
